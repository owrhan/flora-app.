name: Build Flora APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: unzip -q flora-apk-project.zip

      - name: Install dependencies
        working-directory: flora-apk-project
        run: npm install

      - name: Add Android platform
        working-directory: flora-apk-project
        run: npx cap add android

      - name: Build debug APK
        working-directory: flora-apk-project/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flora-marketing-debug-apk
          path: flora-apk-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

